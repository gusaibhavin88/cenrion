version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cenrion-app
    container_name: cenrion_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - cenrion_net

  web:
    image: nginx:alpine
    container_name: cenrion_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cenrion_net

  db:
    image: mysql:8.0
    container_name: cenrion_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cenrion
      MYSQL_USER: cenrion
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - cenrion_net

  redis:
    image: redis:alpine
    container_name: cenrion_redis
    networks:
      - cenrion_net

volumes:
  db_data:

networks:
  cenrion_net:
    driver: bridge
