services:
  - type: web
    name: cenrion
    runtime: docker
    plan: free
    rootDir: cenrion
    dockerfilePath: ./cenrion/Dockerfile.render
    dockerContext: ./cenrion
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Cenrion
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_SECURE_COOKIE
        value: "true"
